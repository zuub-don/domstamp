name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm run docs:check
      - run: npm run docs:build
      - run: npm run publint
      - run: npm run attw
      - run: npm pack --dry-run --workspace domstamp
      - run: npm pack --dry-run --workspace @domstamp/tq1
      - run: npm pack --dry-run --workspace @domstamp/playwright

  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: mkdir -p artifacts
      - run: GYM_UID=$(id -u) GYM_GID=$(id -g) docker compose run --rm runner npm run test:matrix
